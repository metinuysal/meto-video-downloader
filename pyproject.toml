[project]
name = "meto-video-downloader"
version = "2.0.0"
description = "METO Bulk Video Downloader"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = "."
