{% extends "base.html" %}
{% block title %}Login - METO Bulk Video Downloader{% endblock %}

{% block content %}
<div class="landing-hero" style="min-height: 80vh; display: flex; align-items: center; justify-content: center; background: none;">
    <div class="settings-card" style="max-width: 400px; width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
        <div style="text-align: center; margin-bottom: 24px; animation: fadeUp 0.4s ease-out 0.1s both;">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--primary); margin-bottom: 12px; animation: popIn 0.5s ease-out 0.2s both;">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <h2 style="margin: 0; font-size: 1.5rem;">Welcome Back</h2>
            <p style="color: var(--text-muted); margin-top: 8px;">Sign in to continue</p>
        </div>
        
        {% if error %}
        <div style="background: rgba(239, 68, 68, 0.1); color: #ef4444; padding: 12px; border-radius: 6px; margin-bottom: 16px; text-align: center; border: 1px solid rgba(239, 68, 68, 0.2);">
            {{ error }}
        </div>
        {% endif %}
        
        <form method="POST" action="/login">
            <div class="setting-group" style="margin-bottom: 16px; animation: fadeUp 0.4s ease-out 0.2s both;">
                <label for="username" style="display: block; margin-bottom: 6px; font-weight: 500;">Username</label>
                <input type="text" id="username" name="username" class="form-control" style="width: 100%; padding: 10px 12px; border: 1px solid #333; border-radius: 6px; background: #1a1a1a; color: #fff; font-size: 1rem; transition: all 0.2s;" required autofocus onfocus="this.style.borderColor='var(--accent)'; this.style.boxShadow='0 0 0 3px rgba(62,166,255,0.15)';" onblur="this.style.borderColor='#333'; this.style.boxShadow='none';">
            </div>
            
            <div class="setting-group" style="margin-bottom: 24px; animation: fadeUp 0.4s ease-out 0.3s both;">
                <label for="password" style="display: block; margin-bottom: 6px; font-weight: 500;">Password</label>
                <input type="password" id="password" name="password" class="form-control" style="width: 100%; padding: 10px 12px; border: 1px solid #333; border-radius: 6px; background: #1a1a1a; color: #fff; font-size: 1rem; transition: all 0.2s;" required onfocus="this.style.borderColor='var(--accent)'; this.style.boxShadow='0 0 0 3px rgba(62,166,255,0.15)';" onblur="this.style.borderColor='#333'; this.style.boxShadow='none';">
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 1.1em; border-radius: 6px; font-weight: 600; animation: fadeUp 0.4s ease-out 0.4s both;">Sign In</button>
        </form>
    </div>
</div>
{% endblock %}
