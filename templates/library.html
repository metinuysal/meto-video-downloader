{% extends "base.html" %}
{% block title %}Library - METO Bulk Video Downloader{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Library</h1>
</div>

<div class="library-layout">
    <aside class="filters-panel" id="filters-panel">
        <div class="filters-header">
            <h3>Filters</h3>
            <button class="btn btn-sm btn-outline close-filters" id="close-filters">&times;</button>
        </div>

        <div class="filter-group">
            <label>Search</label>
            <input type="text" id="filter-search" placeholder="Title or uploader...">
        </div>

        <div class="filter-group">
            <label>Favorites</label>
            <select id="filter-favorite">
                <option value="">All</option>
                <option value="1">Favorites Only</option>
            </select>
        </div>

        <div class="filter-group">
            <label>Orientation</label>
            <select id="filter-orientation"><option value="">All</option></select>
        </div>

        <div class="filter-group">
            <label>Length</label>
            <select id="filter-length">
                <option value="">All</option>
                <option value="short">Short (&lt;1min)</option>
                <option value="medium">Medium (1-10min)</option>
                <option value="long">Long (10-60min)</option>
                <option value="feature">Feature (&gt;60min)</option>
            </select>
        </div>

        <div class="filter-group">
            <label>Aspect Ratio</label>
            <select id="filter-aspect"><option value="">All</option></select>
        </div>

        <div class="filter-group">
            <label>Category</label>
            <select id="filter-category"><option value="">All</option></select>
        </div>

        <div class="filter-group">
            <label>Sort By</label>
            <select id="filter-sort">
                <option value="downloaded_at">Date Downloaded</option>
                <option value="title">Title</option>
                <option value="duration">Duration</option>
                <option value="filesize">File Size</option>
                <option value="upload_date">Upload Date</option>
            </select>
        </div>

        <button id="clear-filters" class="btn btn-sm btn-outline">Clear Filters</button>
    </aside>

    <div class="library-main">
        <div class="library-toolbar">
            <span id="video-count">0 videos</span>
            
            <div id="bulk-toolbar" style="display:none; gap: 8px; align-items: center; background: #2a2a2a; padding: 4px 12px; border-radius: 6px; margin-left: 16px;">
                <span id="selected-count" style="font-weight: 500; font-size: 0.9em; margin-right: 8px;">0 selected</span>
                <select id="bulk-move-project" class="btn btn-sm" style="max-width: 150px;">
                    <option value="">Move to...</option>
                    {% for p in projects %}
                    <option value="{{ p.id }}">{{ p.name }}</option>
                    {% endfor %}
                </select>
                <button id="bulk-category" class="btn btn-sm btn-outline">Set Category</button>
                <button id="bulk-tag" class="btn btn-sm btn-outline">Add Tag</button>
                <button id="bulk-delete" class="btn btn-sm btn-danger">Delete</button>
                <button id="bulk-clear" class="btn btn-sm btn-outline">&times;</button>
            </div>

            <div class="toolbar-actions" style="margin-left: auto;">
                <button class="btn btn-sm btn-outline filter-toggle" id="filter-toggle">Filters</button>
                <div class="view-toggle">
                    <button id="view-grid" class="btn btn-sm active" title="Grid">&#9638;</button>
                    <button id="view-list" class="btn btn-sm" title="List">&#9776;</button>
                </div>
            </div>
        </div>
        <div id="video-grid" class="video-grid"></div>
        <div id="video-list" class="video-list" style="display:none;"></div>
        <div id="load-more-container" style="text-align:center;padding:20px;">
            <button id="load-more" class="btn btn-outline" style="display:none;">Load More</button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const PROJECT_ID = {{ current.id }};
    let currentOffset = 0;
    const LIMIT = 24;
    let currentView = "grid";

    async function loadFilters() {
        const res = await fetch(`/api/filters?project=${PROJECT_ID}`);
        const data = await res.json();
        populateSelect("filter-orientation", data.orientations || []);
        populateSelect("filter-aspect", data.aspect_ratios || []);
        populateSelect("filter-category", data.categories || []);
    }

    function populateSelect(id, items) {
        const sel = document.getElementById(id);
        const first = sel.options[0];
        sel.innerHTML = "";
        sel.appendChild(first);
        items.forEach(item => {
            const opt = document.createElement("option");
            opt.value = item;
            opt.textContent = item;
            sel.appendChild(opt);
        });
    }

    async function loadVideos(append = false) {
        const params = new URLSearchParams();
        params.set("project", PROJECT_ID);
        params.set("limit", LIMIT);
        params.set("offset", append ? currentOffset : 0);

        const search = document.getElementById("filter-search").value;
        if (search) params.set("search", search);
        const favorite = document.getElementById("filter-favorite").value;
        if (favorite) params.set("favorite", favorite);
        const orientation = document.getElementById("filter-orientation").value;
        if (orientation) params.set("orientation", orientation);
        const length = document.getElementById("filter-length").value;
        if (length) params.set("length_category", length);
        const aspect = document.getElementById("filter-aspect").value;
        if (aspect) params.set("aspect_ratio", aspect);
        const category = document.getElementById("filter-category").value;
        if (category) params.set("custom_category", category);
        params.set("sort", document.getElementById("filter-sort").value);

        const res = await fetch(`/api/videos?${params}`);
        const data = await res.json();

        document.getElementById("video-count").textContent = `${data.total} video${data.total !== 1 ? "s" : ""}`;

        if (!append) currentOffset = 0;
        currentOffset = (append ? currentOffset : 0) + data.videos.length;

        const showMore = currentOffset < data.total;
        document.getElementById("load-more").style.display = showMore ? "inline-block" : "none";

        renderVideos(data.videos, append);
    }

    function renderVideos(videos, append) {
        const grid = document.getElementById("video-grid");
        const list = document.getElementById("video-list");
        if (!append) { grid.innerHTML = ""; list.innerHTML = ""; }

        if (!videos.length && !append) {
            grid.innerHTML = '<p class="empty-state">No videos found.</p>';
            return;
        }

        const placeholder = '<div class="thumb-placeholder"><svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></div>';

        videos.forEach(v => {
            const star = v.favorite ? '&#9733;' : '&#9734;';
            const card = document.createElement("div");
            card.className = "video-card";
            const thumb = v.thumbnail ? `<img src="${escapeHtml(v.thumbnail)}" alt="" loading="lazy" onerror="this.parentElement.innerHTML='${placeholder.replace(/"/g, "\\'")}';this.remove();">` : placeholder;
            card.innerHTML = `
                <div class="video-thumb" onclick="window.location.href='/video/${v.id}'">${thumb}
                    <input type="checkbox" class="video-checkbox" data-id="${v.id}" onclick="event.stopPropagation(); toggleSelection(this);" style="position:absolute; top:8px; left:8px; width:18px; height:18px; z-index:10; cursor:pointer;">
                    <button class="star-btn" data-id="${v.id}" title="Toggle favorite">${star}</button>
                </div>
                <div class="video-info" onclick="window.location.href='/video/${v.id}'">
                    <h4 class="truncate" title="${escapeHtml(v.title)}">${escapeHtml(v.title)}</h4>
                    <div class="video-meta">
                        ${v.duration_fmt ? `<span>${v.duration_fmt}</span>` : ""}
                        ${v.orientation ? `<span class="badge">${v.orientation}</span>` : ""}
                        ${v.aspect_ratio ? `<span class="badge">${v.aspect_ratio}</span>` : ""}
                    </div>
                    ${v.tags && v.tags.length ? `<div class="video-tags">${v.tags.slice(0,3).map(t => `<span class="tag">${escapeHtml(t.name)}</span>`).join("")}</div>` : ""}
                </div>`;
            grid.appendChild(card);

            const row = document.createElement("div");
            row.className = "video-row";
            const smallThumb = v.thumbnail ? `<img src="${escapeHtml(v.thumbnail)}" alt="" loading="lazy" onerror="this.style.display='none'">` : "";
            row.innerHTML = `
                <input type="checkbox" class="video-checkbox" data-id="${v.id}" onclick="event.stopPropagation(); toggleSelection(this);" style="margin: 0 12px; width:18px; height:18px; cursor:pointer;">
                <div class="video-thumb small" onclick="window.location.href='/video/${v.id}'">${smallThumb}</div>
                <div class="video-info" onclick="window.location.href='/video/${v.id}'">
                    <h4 class="truncate" title="${escapeHtml(v.title)}">${escapeHtml(v.title)}</h4>
                    <div class="video-meta">
                        ${v.uploader ? `<span>${escapeHtml(v.uploader)}</span>` : ""}
                        <span>${v.duration_fmt || "-"}</span>
                        ${v.filesize_fmt ? `<span>${v.filesize_fmt}</span>` : ""}
                        ${v.orientation ? `<span class="badge">${v.orientation}</span>` : ""}
                        ${v.custom_category ? `<span class="badge cat">${escapeHtml(v.custom_category)}</span>` : ""}
                    </div>
                </div>
                <button class="star-btn-row" data-id="${v.id}" title="Toggle favorite">${star}</button>`;
            list.appendChild(row);
        });
    }

    document.getElementById("video-grid").addEventListener("click", async (e) => {
        const btn = e.target.closest(".star-btn");
        if (!btn) return;
        e.stopPropagation();
        const id = btn.dataset.id;
        const res = await fetch(`/api/video/${id}/favorite`, { method: "POST" });
        const data = await res.json();
        btn.innerHTML = data.favorite ? "&#9733;" : "&#9734;";
        btn.classList.toggle("starred", data.favorite);
    });

    document.getElementById("video-list").addEventListener("click", async (e) => {
        const btn = e.target.closest(".star-btn-row");
        if (!btn) return;
        e.stopPropagation();
        const id = btn.dataset.id;
        const res = await fetch(`/api/video/${id}/favorite`, { method: "POST" });
        const data = await res.json();
        btn.innerHTML = data.favorite ? "&#9733;" : "&#9734;";
        btn.classList.toggle("starred", data.favorite);
    });

    document.getElementById("clear-filters").addEventListener("click", () => {
        document.getElementById("filter-search").value = "";
        document.getElementById("filter-favorite").value = "";
        document.getElementById("filter-orientation").value = "";
        document.getElementById("filter-length").value = "";
        document.getElementById("filter-aspect").value = "";
        document.getElementById("filter-category").value = "";
        document.getElementById("filter-sort").value = "downloaded_at";
        loadVideos();
    });

    let searchTimeout;
    document.getElementById("filter-search").addEventListener("input", () => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => loadVideos(), 400);
    });

    ["filter-favorite", "filter-orientation", "filter-length", "filter-aspect", "filter-category", "filter-sort"].forEach(id => {
        document.getElementById(id).addEventListener("change", () => loadVideos());
    });

    document.getElementById("load-more").addEventListener("click", () => loadVideos(true));

    document.getElementById("view-grid").addEventListener("click", () => {
        currentView = "grid";
        document.getElementById("video-grid").style.display = "";
        document.getElementById("video-list").style.display = "none";
        document.getElementById("view-grid").classList.add("active");
        document.getElementById("view-list").classList.remove("active");
    });

    document.getElementById("view-list").addEventListener("click", () => {
        currentView = "list";
        document.getElementById("video-grid").style.display = "none";
        document.getElementById("video-list").style.display = "";
        document.getElementById("view-list").classList.add("active");
        document.getElementById("view-grid").classList.remove("active");
    });

    document.getElementById("filter-toggle").addEventListener("click", () => {
        document.getElementById("filters-panel").classList.toggle("open");
    });

    document.getElementById("close-filters").addEventListener("click", () => {
        document.getElementById("filters-panel").classList.remove("open");
    });

    let selectedVideoIds = new Set();

    function updateBulkToolbar() {
        const toolbar = document.getElementById("bulk-toolbar");
        const countSpan = document.getElementById("selected-count");
        if (selectedVideoIds.size > 0) {
            toolbar.style.display = "flex";
            countSpan.textContent = `${selectedVideoIds.size} selected`;
        } else {
            toolbar.style.display = "none";
        }
    }

    window.toggleSelection = function(checkbox) {
        const id = parseInt(checkbox.dataset.id);
        if (checkbox.checked) {
            selectedVideoIds.add(id);
        } else {
            selectedVideoIds.delete(id);
        }
        
        // Sync checkboxes between grid and list views
        document.querySelectorAll(`.video-checkbox[data-id="${id}"]`).forEach(cb => {
            cb.checked = checkbox.checked;
        });
        
        updateBulkToolbar();
    };

    function clearSelection() {
        selectedVideoIds.clear();
        document.querySelectorAll(".video-checkbox").forEach(cb => cb.checked = false);
        updateBulkToolbar();
    }

    document.getElementById("bulk-clear").addEventListener("click", clearSelection);

    async function executeBulkAction(action, value) {
        if (!selectedVideoIds.size) return;
        const ids = Array.from(selectedVideoIds);
        try {
            const res = await fetch("/api/videos/bulk", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ action, video_ids: ids, value })
            });
            if (res.ok) {
                clearSelection();
                loadVideos();
                loadFilters();
            } else {
                alert("Bulk action failed.");
            }
        } catch (e) {
            alert("Error communicating with server.");
        }
    }

    document.getElementById("bulk-move-project").addEventListener("change", (e) => {
        const targetId = e.target.value;
        if (!targetId) return;
        if (!confirm(`Move ${selectedVideoIds.size} videos to this project?`)) {
            e.target.value = "";
            return;
        }
        executeBulkAction("move_project", targetId);
        e.target.value = "";
    });

    document.getElementById("bulk-category").addEventListener("click", () => {
        const cat = prompt(`Enter category for ${selectedVideoIds.size} videos:`);
        if (cat !== null) {
            executeBulkAction("set_category", cat.trim());
        }
    });

    document.getElementById("bulk-tag").addEventListener("click", () => {
        const tag = prompt(`Enter tag to add to ${selectedVideoIds.size} videos:`);
        if (tag !== null && tag.trim()) {
            executeBulkAction("add_tag", tag.trim());
        }
    });

    document.getElementById("bulk-delete").addEventListener("click", () => {
        if (confirm(`Are you sure you want to delete ${selectedVideoIds.size} videos permanently?`)) {
            executeBulkAction("delete", null);
        }
    });

    loadFilters();
    loadVideos();
</script>
{% endblock %}
